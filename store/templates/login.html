{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Omar Sat</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700;900&display=swap" rel="stylesheet">
    
</head>
<body class="login-body">

    <nav class="navbar">
        <div class="logo">
            <a href="{% url 'home' %}" style="text-decoration: none; color: white;">
                Omar<span class="neon-text">Sat</span>
            </a>
        </div>
        </nav>
 <div class="floating-menu" id="floatMenu">
    
    <a href="tel:01011058982" class="float-item phone">
        <span class="tooltip">اتصال</span> <i class="fa-solid fa-phone"></i>
    </a>

    <a href="https://wa.me/+201011058982" target="_blank" class="float-item whatsapp">
        <span class="tooltip">واتساب</span>
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <a href="https://t.me/+201011058982" target="_blank" class="float-item telegram">
        <span class="tooltip">تليجرام</span>
        <i class="fa-brands fa-telegram"></i>
    </a>

    <button class="main-float-btn" onclick="toggleFloatMenu()">
        <i class="fa-solid fa-headset icon-open"></i>
        <i class="fa-solid fa-times icon-close"></i>
    </button>
</div>
    <div class="login-container">
        <div class="login-box">
            
            {% if messages %}
                {% for message in messages %}
                    <div style="background: #b30000; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <h2>أهلاً بك يا كبير 👋</h2>
            
            <form method="POST" action="">

                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                
                <div class="input-box">
                    <input type="text" name="username" required>
                    <label>اسم المستخدم</label>
                </div>
                <div class="input-box">
                    <input type="password" name="password" required>
                    <label>كلمة المرور</label>
                </div>
                
                <button type="submit" class="btn-login-submit">تسجيل الدخول</button>
            </form>
            
            <div class="login-footer">
                <p>ليس لديك حساب؟ <a href="{% url 'signup' %}">أنشئ حساب جديد</a></p>
            </div>
        </div>
    </div>
<script>
        function toggleFloatMenu() {
            document.getElementById('floatMenu').classList.toggle('active');
        }
    </script>
    
</body>
</html>
