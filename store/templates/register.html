{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب جديد | Omar Sat</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="register-page-body">

    <nav class="navbar">
        <div class="logo">
            <a href="{% url 'home' %}" style="text-decoration: none; color: white;">
                Omar<span class="neon-text">Sat</span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">الرئيسية</a></li>
            <li><a href="{% url 'store' %}">المتجر</a></li>
        </ul>
    </nav>

    <div class="signup-wrapper">
        <div class="signup-card">
            
            <div class="signup-header">
                <h2>انضم إلينا 🚀</h2>
                <p>أنشئ حسابك في دقيقة واستمتع بأفضل العروض</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="input-group">
                        <i class="fa fa-user"></i>
                        <input type="text" name="username" placeholder="اسم المستخدم" required>
                    </div>
                    <div class="input-group">
                        <i class="fa fa-envelope"></i>
                        <input type="email" name="email" placeholder="البريد الإلكتروني" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <i class="fa fa-lock"></i>
                        <input type="password" name="password" placeholder="كلمة المرور" required>
                    </div>
                    <div class="input-group">
                        <i class="fa fa-check-circle"></i>
                        <input type="password" name="confirm_password" placeholder="تأكيد كلمة المرور" required>
                    </div>
                </div>

                <button type="submit" class="btn-signup-new">تسجيل حساب جديد</button>
            </form>

            <div class="signup-footer">
                <p>لديك حساب بالفعل؟ <a href="{% url 'login' %}">سجل دخولك</a></p>
            </div>
        </div>
    </div>

</body>
</html>
